<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Finance</title>
<meta name="description" content="Your spending from bank SMS, read from your Daily Finance Google Sheet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#5a2ee6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: wallet-style phone app. Violet header with rounded bottom holding the headline number and a wave chart,
   white rounded cards below, fixed bottom tab bar. One deliberate light look (violet + orange), set explicitly. */
:root {
  --violet: #5a2ee6;
  --violet-deep: #4a22c9;
  --violet-soft: #efeafd;
  --orange: #ff7a2f;
  --ink: #2a2158;
  --muted: #a39fc0;
  --line: #ece9f6;
  --bg: #f6f5fb;
  --card: #ffffff;
  --good: #1e9e63;
  --font: "Lato", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
.app.bare { max-width: none; padding-bottom: 0; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

/* violet header */
.head { background: linear-gradient(160deg, #6a3cf5 0%, var(--violet) 45%, var(--violet-deep) 100%); color: #fff;
  border-radius: 0 0 34px 34px; padding: calc(14px + env(safe-area-inset-top)) 20px 18px; display: grid; gap: 6px;
  box-shadow: 0 14px 30px -18px rgba(74, 34, 201, 0.7); overflow: hidden; }
.head-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.round { appearance: none; border: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: rgba(255,255,255,0.14); color: #fff; }
.round svg { width: 18px; height: 18px; }
.round:disabled { opacity: 0.35; cursor: default; }
.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }
.month { display: flex; align-items: center; gap: 4px; }
.month .round { width: 30px; height: 30px; background: transparent; }
.month span { font-weight: 700; font-size: 1.02rem; min-width: 92px; text-align: center; }
.title { text-align: center; font-weight: 700; font-size: 1.3rem; }
.amount { text-align: center; font-weight: 900; font-size: clamp(2.4rem, 12vw, 3rem); line-height: 1.05; letter-spacing: -0.01em; margin-top: 6px; }
.amount sup, .summary sup { font-size: 0.45em; font-weight: 700; vertical-align: 0.95em; margin-right: 2px; }
.amount-sub { text-align: center; font-size: 0.98rem; opacity: 0.9; }
.seg { display: flex; justify-content: center; gap: 26px; margin-top: 8px; }
.seg button { appearance: none; border: 0; background: none; padding: 4px 2px; cursor: pointer; font-size: 1rem; color: rgba(255,255,255,0.9); }
.seg button.on { color: var(--orange); font-weight: 700; }
.wave { margin: 4px -20px -18px; }
.wave svg { display: block; width: 100%; height: auto; }

/* body */
.body { padding: 18px 18px 0; display: grid; gap: 16px; }
.card { background: var(--card); border-radius: 22px; box-shadow: 0 10px 28px -20px rgba(42, 33, 88, 0.45); border: 1px solid var(--line); }
.ringcard { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 16px; align-items: center; padding: 16px 18px; }
.ringcard.hot { background: var(--orange); color: #fff; border-color: transparent; box-shadow: 0 16px 30px -18px rgba(255, 122, 47, 0.9); }
.ringcard h3 { margin: 0 0 6px; font-size: 1.08rem; font-weight: 700; color: var(--violet); }
.ringcard.hot h3 { color: #fff; }
.kv { display: flex; gap: 22px; flex-wrap: wrap; }
.kv div { display: grid; }
.kv small { font-size: 0.8rem; color: var(--muted); }
.ringcard.hot .kv small { color: rgba(255,255,255,0.78); }
.kv b { font-weight: 900; font-size: 1.02rem; }
.ring { width: 76px; height: 76px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px; }
.sechead h2 { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--violet); }
.link { appearance: none; border: 0; background: none; padding: 0; color: var(--violet); font-size: 0.85rem; cursor: pointer; }
.list { padding: 4px 6px; }
.tx { appearance: none; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; display: grid; grid-template-columns: 46px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 11px 10px; border-bottom: 1px solid var(--line); }
.tx:last-child { border-bottom: 0; }
.logo { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 14px -10px rgba(42,33,88,0.5); font-weight: 900; }
.logo svg { width: 20px; height: 20px; }
.tx .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .date { font-size: 0.8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .val { font-weight: 700; white-space: nowrap; }
.tx .val.in { color: var(--good); }
.tx .val.nc { color: var(--muted); font-weight: 400; }
.tag { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--violet-soft); color: var(--violet); margin-left: 6px; vertical-align: 1px; }
.detail { margin: 0 10px 10px 70px; padding: 10px 12px; background: var(--bg); border-radius: 14px; font-size: 0.84rem; display: grid; gap: 6px; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 3px 12px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.dayhead { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); font-weight: 700; padding: 6px 6px 2px; }

/* category tiles */
.tiles { display: flex; gap: 14px; overflow-x: auto; padding: 4px 4px 8px; scrollbar-width: none; }
.tiles::-webkit-scrollbar { display: none; }
.tile { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; display: grid; justify-items: center; gap: 6px; flex: none; width: 66px; }
.tile .sq { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; background: #fff; color: var(--violet); border: 1px solid var(--line); box-shadow: 0 8px 18px -12px rgba(42,33,88,0.45); }
.tile .sq svg { width: 26px; height: 26px; }
.tile span { font-size: 0.76rem; color: var(--violet); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 66px; }
.tile small { font-size: 0.7rem; color: var(--muted); margin-top: -4px; }
.tile.on .sq { background: var(--violet); color: #fff; border-color: var(--violet); box-shadow: 0 10px 20px -10px rgba(90,46,230,0.9); }
.tile.on span { font-weight: 700; }
.search { width: 100%; font: inherit; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); }

/* budget */
.bhead { padding: calc(14px + env(safe-area-inset-top)) 20px 0; display: grid; gap: 8px; }
.bhead .title { color: var(--violet); }
.bars svg { display: block; width: 100%; height: auto; }
.legend { display: flex; justify-content: center; gap: 18px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.summary { background: linear-gradient(160deg, #6a3cf5, var(--violet) 50%, var(--violet-deep)); color: #fff; border-radius: 30px; padding: 20px 20px 18px; display: grid; gap: 4px; box-shadow: 0 18px 34px -20px rgba(74,34,201,0.9); }
.summary .mh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.summary .mh b { font-size: 1.35rem; font-weight: 700; }
.summary .row { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.18); font-size: 1.05rem; }
.summary .row.last { border-bottom: 0; }
.summary .row b { font-weight: 900; font-size: 1.45rem; }
.summary .row.cost { color: var(--orange); }
.goal { margin-top: 8px; background: var(--orange); border-radius: 20px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; color: #fff; box-shadow: 0 14px 26px -16px rgba(255,122,47,0.95); }
.goal.over { background: #ff5a4f; }
.goal .medal { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6); display: grid; place-items: center; }
.goal .medal svg { width: 22px; height: 22px; }
.goal b { display: block; font-size: 1.05rem; }
.goal small { opacity: 0.88; }
.note { font-size: 0.8rem; color: var(--muted); text-align: center; margin: 0; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #fff; border-top: 1px solid var(--line);
  padding: 8px 18px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -10px 24px -20px rgba(42,33,88,0.5); }
.tabbar button { appearance: none; border: 0; background: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--violet); }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button.on { background: var(--violet); color: #fff; box-shadow: 0 10px 20px -8px rgba(90,46,230,0.85); }

/* states */
.notice { border-radius: 18px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); display: grid; gap: 6px; }
.notice.err { background: #fff1ef; border-color: #ffd9d4; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.skel { background: rgba(255,255,255,0.22); border-radius: 10px; color: transparent; }
.btn { appearance: none; border: 0; border-radius: 999px; padding: 14px 22px; background: var(--orange); color: #fff; font-weight: 900; letter-spacing: 0.06em; cursor: pointer; box-shadow: 0 14px 26px -14px rgba(255,122,47,0.95); }
.btn.ghost { background: var(--violet-soft); color: var(--violet); box-shadow: none; letter-spacing: 0; padding: 11px 18px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.85rem; font-weight: 700; }
.field input { font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); width: 100%; }
.err-text { color: #d6453b; font-size: 0.88rem; }

/* onboarding splash */
.splash { min-height: 100vh; background: linear-gradient(170deg, #6a3cf5, var(--violet) 40%, var(--violet-deep)); color: #fff; padding: calc(40px + env(safe-area-inset-top)) 28px calc(30px + env(safe-area-inset-bottom)); display: grid; align-content: start; gap: 16px; }
.splash h1 { margin: 0; font-size: 2.3rem; font-weight: 900; line-height: 1.05; }
.splash p { margin: 0; opacity: 0.88; max-width: 34ch; }
.splash svg.art { width: 100%; max-width: 360px; height: auto; justify-self: center; }
.splash ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; opacity: 0.9; font-size: 0.92rem; }
.splash .card { color: var(--ink); padding: 16px; display: grid; gap: 10px; }
</style>
</head>
<body>
<div class="app" id="app"><main id="view"></main></div>
<nav class="tabbar" id="tabbar" hidden aria-label="Sections">
  <button data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5"/></svg></button>
  <button data-tab="history" aria-label="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button data-tab="budget" aria-label="Budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg></button>
  <button data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</nav>

<script>
(function () {
  "use strict";
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var CARD_BILL = "Card Bill Payment", RENT = "Rent";

  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var state = {
    connected: false, view: "home", months: [], month: null, rows: null, prevRows: null, budget: null, totals: [],
    updatedAt: null, loading: false, error: null, staleError: null,
    mode: "spend", period: "month", cat: null, q: "", open: null, showConnect: false
  };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function num(v) {
    var fixed = (Math.round(Math.abs(v) * 100) / 100).toFixed(2).replace(/\.00$/, "");
    var parts = fixed.split("."), w = parts[0];
    if (w.length > 3) w = w.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + w.slice(-3);
    return w + (parts[1] ? "." + parts[1] : "");
  }
  function inr(v) { return (v < 0 ? "−" : "") + "₹" + num(v); }
  function big(v) { return "<sup>₹</sup>" + num(Math.round(v)); }
  function short(v) {
    if (v >= 100000) return "₹" + (v / 100000).toFixed(1).replace(/\.0$/, "") + "L";
    if (v >= 1000) return "₹" + (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
    return "₹" + Math.round(v);
  }
  function parseMonth(name) {
    var m = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})$/.exec(name || "");
    return m ? { name: name, y: +m[2], m: MONTHS.indexOf(m[1]) } : null;
  }
  function fromMs(ms) { var d = new Date(ms); return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate(), h: d.getHours(), mi: d.getMinutes(), wd: d.getDay(), t: ms }; }
  function now() { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() }; }
  function isSpend(r) { return r.type === "Expense" && r.category !== CARD_BILL; }
  function isDaily(r) { return isSpend(r) && r.category !== RENT; }
  function sum(list, f) { return (list || []).reduce(function (s, r) { return s + (f(r) ? r.amount : 0); }, 0); }
  function daysIn(mo) { return new Date(mo.y, mo.m + 1, 0).getDate(); }
  function isCurrent(mo) { var n = now(); return !!mo && mo.y === n.y && mo.m === n.m; }
  function hhmm(w) { var h = w.h % 12 || 12; return h + ":" + String(w.mi).padStart(2, "0") + (w.h < 12 ? " am" : " pm"); }
  function dmy(w) { return String(w.d).padStart(2, "0") + "." + String(w.m + 1).padStart(2, "0") + "." + w.y; }
  function ago(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago";
  }

  // ---------- icons ----------
  var ICON = {
    food: "M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 0-3 2-3 5s1 4 3 4v9",
    cart: "M3 4h2l2 11h11l2-8H6M9 20h.01M17 20h.01",
    car: "M5 16v-5l2-5h10l2 5v5M4 16h16M6 16v2M18 16v2M8 13h.01M16 13h.01",
    fuel: "M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h12M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3M8 8h4",
    bag: "M5 8h14l-1 13H6L5 8zM9 8V6a3 3 0 0 1 6 0v2",
    bolt: "M13 2L4 14h7l-1 8 9-12h-7l1-8z",
    health: "M12 6v12M6 12h12",
    film: "M4 5h16v14H4zM8 5v14M16 5v14M4 12h16",
    plane: "M3 13l18-7-6 15-3-6-9-2z",
    book: "M3 21h18M5 21V10M19 21V10M9 21v-7M15 21v-7M3 10l9-6 9 6z",
    home: "M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5",
    swap: "M7 7h13l-3-3M17 17H4l3 3",
    cash: "M3 7h18v10H3zM12 12h.01M7 10v4M17 10v4",
    card: "M3 6h18v12H3zM3 10h18M7 15h3",
    down: "M12 4v14M6 12l6 6 6-6",
    grid: "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
    dots: "M5 12h.01M12 12h.01M19 12h.01"
  };
  var CATS = {
    "food & dining": ["#ff7a2f", "food", "Food"], "food": ["#ff7a2f", "food", "Food"], "groceries": ["#1e9e63", "cart", "Groceries"],
    "transport": ["#3b7dd8", "car", "Transport"], "fuel": ["#b07a2b", "fuel", "Fuel"], "shopping": ["#e0458a", "bag", "Shopping"],
    "bills & recharge": ["#d8a400", "bolt", "Bills"], "health": ["#e2453c", "health", "Health"], "entertainment": ["#8a5cf0", "film", "Fun"],
    "travel": ["#1aa2b8", "plane", "Travel"], "education": ["#5a2ee6", "book", "Study"], "rent": ["#5a2ee6", "home", "Home"],
    "transfers": ["#8f8aa8", "swap", "Transfers"], "cash withdrawal": ["#1e9e63", "cash", "Cash"], "card bill payment": ["#8f8aa8", "card", "Card bill"],
    "income": ["#1e9e63", "down", "Income"], "other": ["#8f8aa8", "dots", "Other"]
  };
  function cat(name) {
    var m = CATS[String(name).toLowerCase()];
    return m ? { color: m[0], icon: m[1], label: m[2] } : { color: "#5a2ee6", icon: null, label: name };
  }
  function svg(path, w) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"><path d="' + path + '"/></svg>'; }
  function logo(name) {
    var c = cat(name);
    return '<span class="logo" style="color:' + c.color + '" aria-hidden="true">' + (c.icon ? svg(ICON[c.icon]) : esc(String(name).charAt(0).toUpperCase())) + "</span>";
  }
  var MEDAL = "M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.5 14 7 21l5-3 5 3-1.5-7";
  var REFRESH = "M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7";

  // ---------- charts ----------
  // Smooth curve through points (Catmull-Rom converted to cubic Béziers).
  function smooth(pts) {
    if (pts.length < 2) return pts.length ? "M0," + pts[0][1] + " L360," + pts[0][1] : "";
    var d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += " C" + c1x.toFixed(1) + "," + c1y.toFixed(1) + " " + c2x.toFixed(1) + "," + c2y.toFixed(1) + " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1);
    }
    return d;
  }
  /** Wave chart for the violet header. points: [{label, value}], focus: index to mark. */
  function wave(points, focus) {
    var W = 360, H = 150, top = 30, base = 116;
    var max = Math.max.apply(null, points.map(function (p) { return p.value; }).concat([1]));
    var pad = 22, step = (W - 2 * pad) / Math.max(points.length - 1, 1);
    var pts = points.map(function (p, i) { return [pad + i * step, base - (p.value / max) * (base - top)]; });
    // Run the curve out to both edges so the wave fills the header like a backdrop.
    var line = smooth([[0, pts[0][1]]].concat(pts, [[W, pts[pts.length - 1][1]]]));
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Spending per day"><defs>' +
      '<linearGradient id="wf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a2f" stop-opacity="0.55"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="ws" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9b5e"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs>';
    s += '<path d="' + line + " L" + W + "," + base + " L0," + base + ' Z" fill="url(#wf)"/>';
    s += '<path d="' + line + '" fill="none" stroke="url(#ws)" stroke-width="3" stroke-linecap="round"/>';
    if (focus != null && focus >= 0 && pts[focus]) {
      var f = pts[focus];
      s += '<line x1="' + f[0].toFixed(1) + '" x2="' + f[0].toFixed(1) + '" y1="' + f[1].toFixed(1) + '" y2="' + base + '" stroke="rgba(255,255,255,0.45)" stroke-width="1"/>';
      s += '<circle cx="' + f[0].toFixed(1) + '" cy="' + f[1].toFixed(1) + '" r="5" fill="#fff" stroke="#ff7a2f" stroke-width="2"/>';
      var tx = Math.min(Math.max(f[0], 30), W - 30);
      s += '<text x="' + tx.toFixed(1) + '" y="' + Math.max(f[1] - 11, 13).toFixed(1) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">' + short(points[focus].value) + "</text>";
    }
    var every = Math.ceil(points.length / 7);
    points.forEach(function (p, i) {
      if (points.length > 8 && i % every !== 0 && i !== points.length - 1) return;
      var x = pad + i * step;
      s += '<text x="' + x.toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10.5" fill="' + (i === focus ? "#fff" : "rgba(255,255,255,0.6)") + '"' + (i === focus ? ' font-weight="700"' : "") + ">" + esc(p.label) + "</text>";

  function ring(ratio, track, stroke, text, textColor) {

      '<circle cx="38" cy="38" r="30" fill="none" stroke="' + stroke + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (C * r).toFixed(1) + " " + C.toFixed(1) + '" transform="rotate(-90 38 38)"/>' +
      '<text x="38" y="43" text-anchor="middle" font-size="15" font-weight="900" fill="' + textColor + '">' + text + "</text></svg>";
  }

  /** Daily spending (excluding rent and card bills) for the last 7 days of the month shown, or every day of it. */
  function series(period) {
    var mo = state.month, n = now();
    var cur = (state.rows || []).filter(isDaily), prev = (state.prevRows || []).filter(isDaily);
    if (period === "week") {
      var end = new Date(mo.y, mo.m, isCurrent(mo) ? n.d : daysIn(mo)), pts = [];
      for (var k = 6; k >= 0; k--) {
        var day = new Date(end.getFullYear(), end.getMonth(), end.getDate() - k);
        var src = day.getMonth() === mo.m ? cur : prev;
        pts.push({ label: WD[day.getDay()], d: day.getDate(), m: day.getMonth(),
          value: sum(src, function (r) { return r.when.d === day.getDate() && r.when.m === day.getMonth(); }) });
      }
      return pts;
    }
    var out = [];
    for (var i = 1; i <= daysIn(mo); i++) out.push({ label: String(i), d: i, m: mo.m, value: sum(cur, function (r) { return r.when.d === i; }) });
    return out;
  }
  function peak(pts) { return pts.reduce(function (b, p, i, a) { return p.value > a[b].value ? i : b; }, 0); }

  // ---------- connection & data ----------
  var CONFIG_KEY = "dfConfig";
  function readConfig() { try { return JSON.parse(store.get(CONFIG_KEY) || "null"); } catch (e) { return null; } }
  function saveConfig(c) { store.set(CONFIG_KEY, JSON.stringify(c)); }
  // A one-tap link from the script's setup log: …/#connect=<web app URL>&key=<secret>
  function takeConnectLink() {
    var h = location.hash.replace(/^#/, "");
    if (h.indexOf("connect=") < 0) return false;
    var params = {};
    h.split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
    if (!(params.connect && params.key)) return false;
    saveConfig({ url: params.connect, key: params.key });
    return true;
  }
  takeConnectLink();
  // The link can also arrive while the app is already open.
  window.addEventListener("hashchange", function () { if (takeConnectLink()) load(null); });
  function cacheKey(month) { return "dfData:" + (month || "latest"); }
  function cached(month) { try { return JSON.parse(store.get(cacheKey(month)) || "null"); } catch (e) { return null; } }

  function toRows(list) {
    return (list || []).map(function (r, i) {
      return { i: i, when: fromMs(r[0]), type: r[1] || "Expense", amount: Number(r[2]) || 0, merchant: r[3] || "Unknown",
        category: r[4] || "Other", bank: r[5] || "", account: String(r[6] || "").replace(/^'/, ""), ref: String(r[7] || "").replace(/^'/, ""), sms: r[8] || "" };
    }).sort(function (a, b) { return b.when.t - a.when.t; });
  }
  function apply(data) {
    state.months = (data.months || []).map(parseMonth).filter(Boolean);
    state.month = state.months.filter(function (t) { return t.name === data.month; })[0] || null;
    state.rows = toRows(data.rows);
    state.prevRows = data.prevMonth ? toRows(data.prevRows) : null;
    state.budget = data.budget > 0 ? data.budget : null;
    state.totals = data.monthTotals || [];
    state.updatedAt = data.generatedAt || Date.now();
  }
  function load(month) {
    var cfg = readConfig();
    if (!cfg) { state.connected = false; render(); return; }
    state.connected = true;
    var hit = cached(month);
    if (hit && (!state.rows || month !== (state.month && state.month.name))) { apply(hit); state.cat = null; state.open = null; }
    state.loading = true; state.staleError = null; render();
    var url = cfg.url + (cfg.url.indexOf("?") < 0 ? "?" : "&") + "key=" + encodeURIComponent(cfg.key) + (month ? "&month=" + encodeURIComponent(month) : "");
    fetch(url, { cache: "no-store" })
      .then(function (res) { return res.text(); })
      .then(function (text) {
        var data;
        try { data = JSON.parse(text); } catch (e) { throw { code: "not_json" }; }
        if (data.error === "bad_key") throw { code: "bad_key" };
        store.set(cacheKey(data.month), JSON.stringify(data));
        if (!month) store.set(cacheKey(null), JSON.stringify(data));
        var changed = !state.month || state.month.name !== data.month;
        apply(data);
        if (changed) { state.cat = null; state.open = null; }
        state.loading = false; state.error = null; state.staleError = null;
        render();
      })
      .catch(function (e) {
        state.loading = false;
        var copy = e && e.code === "bad_key" ? { t: "The app key doesn't match", d: "Run setup again in the Apps Script editor and open the new connect link." }
          : e && e.code === "not_json" ? { t: "Your script didn't send data", d: "Deploy a New version of the latest script, with Who has access set to Anyone." }
          : { t: navigator.onLine === false ? "You're offline" : "Couldn't reach your sheet", d: "Tap refresh to try again." };
        if (e && e.code === "bad_key") { state.rows = null; state.error = copy; }
        else if (state.rows) state.staleError = copy;
        else state.error = copy;
        render();
      });
  }
  function refresh() { load(state.month ? state.month.name : null); }
  function shiftMonth(dir) {
    var i = state.months.indexOf(state.month), j = i + dir;
    if (i >= 0 && j >= 0 && j < state.months.length) load(state.months[j].name);
  }

  // ---------- pieces ----------
  function monthPicker() {
    var i = state.months.indexOf(state.month);
    return '<div class="month"><button class="round" data-act="older" aria-label="Previous month"' + (i < 0 || i >= state.months.length - 1 ? " disabled" : "") + ">" + svg("M15 5l-7 7 7 7", 2.4) + "</button>" +
      "<span>" + FULL[state.month.m] + "</span>" +
      '<button class="round" data-act="newer" aria-label="Next month"' + (i <= 0 ? " disabled" : "") + ">" + svg("M9 5l7 7-7 7", 2.4) + "</button></div>";
  }
  function refreshBtn(extra) { return '<button class="round' + (state.loading ? " spin" : "") + '" data-act="refresh" aria-label="Refresh"' + (extra || "") + ">" + svg(REFRESH) + "</button>"; }
  function staleNote() {
    return state.staleError ? '<div class="notice err" role="status"><b>' + esc(state.staleError.t) + "</b><span>" + esc(state.staleError.d) + " Showing what loaded " + ago(state.updatedAt) + ".</span></div>" : "";
  }
  function footer() { return state.updatedAt ? '<p class="note">Updated ' + ago(state.updatedAt) + "</p>" : ""; }
  function txRows(list) {
    return list.map(function (r) {
      var key = r.when.t + "|" + r.i, open = state.open === key;
      var cls = r.type === "Income" ? "in" : isSpend(r) ? "" : "nc";
      var sign = r.type === "Income" ? "+" : isSpend(r) ? "-" : "";
      var tag = !isSpend(r) && r.type !== "Income" ? '<span class="tag">not counted</span>' : r.category === RENT ? '<span class="tag">rent</span>' : "";
      var h = '<button class="tx" data-open="' + esc(key) + '" aria-expanded="' + open + '">' + logo(r.type === "Income" ? "Income" : r.category) +
        '<span style="min-width:0"><span class="name">' + esc(r.merchant) + "</span>" + tag + '<span class="date" style="display:block">' + dmy(r.when) + " · " + hhmm(r.when) + " · " + esc(cat(r.category).label) + "</span></span>" +
        '<span class="val ' + cls + '">' + sign + num(r.amount) + "</span></button>";
      if (open) {
        h += '<div class="detail"><dl><dt>Category</dt><dd>' + esc(r.category) + "</dd><dt>Type</dt><dd>" + esc(r.type) + "</dd>" +
          (r.bank ? "<dt>Bank</dt><dd>" + esc(r.bank) + (r.account ? " ••" + esc(r.account) : "") + "</dd>" : "") +
          (r.ref ? "<dt>Reference</dt><dd>" + esc(r.ref) + "</dd>" : "") + "</dl>" + (r.sms ? "<p>" + esc(r.sms) + "</p>" : "") + "</div>";
      }
      return h;
    }).join("");
  }

  // ---------- screens ----------
  function homeView() {
    var mo = state.month, rows = state.rows, n = now();
    var showSpend = state.mode === "spend";
    var total = showSpend ? sum(rows, isSpend) : sum(rows, function (r) { return r.type === "Income"; });
    var pts = series(isCurrent(mo) ? "week" : "month");
    var focus = isCurrent(mo) ? pts.length - 1 : peak(pts);

    var head = '<header class="head"><div class="head-top">' + monthPicker() + refreshBtn() + "</div>" +
      '<div class="amount">' + big(total) + "</div>" +
      '<div class="amount-sub">' + (showSpend ? "Spent in " : "Received in ") + FULL[mo.m] + "</div>" +
      '<div class="seg"><button data-mode="income" class="' + (showSpend ? "" : "on") + '" aria-pressed="' + !showSpend + '">Income</button>' +
      '<button data-mode="spend" class="' + (showSpend ? "on" : "") + '" aria-pressed="' + showSpend + '">Spending</button></div>' +
      '<div class="wave">' + wave(pts, focus) + "</div></header>";

    var cards = "", budget = state.budget;
    if (isCurrent(mo)) {
      var today = sum(rows, function (r) { return isDaily(r) && r.when.d === n.d; });
      var ratio = budget ? today / budget : 0, over = budget && today > budget;
      cards += '<div class="card ringcard">' + ring(ratio, "#ece9f6", over ? "#ff5a4f" : "#ff7a2f", budget ? Math.round(ratio * 100) + "%" : "—", "#5a2ee6") +
        '<div><h3>Today</h3><div class="kv"><div><small>Spent</small><b>' + inr(Math.round(today)) + "</b></div><div><small>" + (over ? "Over by" : "Left") + "</small><b>" +
        (budget ? inr(Math.round(Math.abs(budget - today))) : "Set B4") + "</b></div></div></div></div>";
    }
    if (budget) {
      var monthBudget = budget * daysIn(mo), daily = sum(rows, isDaily), r2 = daily / monthBudget;
      cards += '<div class="card ringcard hot">' + ring(r2, "rgba(255,255,255,0.35)", "#fff", Math.round(r2 * 100) + "%", "#fff") +

  }

  function historyView() {
    var mo = state.month, rows = state.rows, n = now();
    var period = state.period, pts = series(period);
    var total = pts.reduce(function (s, p) { return s + p.value; }, 0);
    var focus = isCurrent(mo) ? pts.length - 1 - (period === "month" ? daysIn(mo) - n.d : 0) : peak(pts);

    var head = '<header class="head"><div class="head-top">' + monthPicker() + refreshBtn() + "</div>" +
      '<div class="title">History</div>' +
      '<div class="seg"><button data-period="week" class="' + (period === "week" ? "on" : "") + '" aria-pressed="' + (period === "week") + '">Week</button>' +
      '<button data-period="month" class="' + (period === "month" ? "on" : "") + '" aria-pressed="' + (period === "month") + '">Month</button></div>' +
      '<div class="amount">' + big(total) + '</div><div class="amount-sub">' + (period === "week" ? "Last 7 days" : FULL[mo.m]) + ", excl. rent</div>" +
      '<div class="wave">' + wave(pts, focus) + "</div></header>";

    rows.filter(isSpend).forEach(function (r) { (groups[r.category] = groups[r.category] || { name: r.category, total: 0 }).total += r.amount; });
    var list = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) { return b.total - a.total; });

      '<button class="tile' + (state.cat ? "" : " on") + '" data-cat="" aria-pressed="' + !state.cat + '"><span class="sq">' + svg(ICON.grid) + "</span><span>All</span><small>" + short(sum(rows, isSpend)) + "</small></button>" +
      list.map(function (g) {
        var c = cat(g.name);
        return '<button class="tile' + (state.cat === g.name ? " on" : "") + '" data-cat="' + esc(g.name) + '" aria-pressed="' + (state.cat === g.name) + '"><span class="sq">' +
          (c.icon ? svg(ICON[c.icon]) : '<b style="font-size:1.3rem">' + esc(g.name.charAt(0)) + "</b>") + "</span><span>" + esc(c.label) + "</span><small>" + short(g.total) + "</small></button>";

  function historyBody() {

      var w = g.w, label = (w.y === n.y && w.m === n.m && w.d === n.d) ? "Today" : (w.y === n.y && w.m === n.m && w.d === n.d - 1) ? "Yesterday" : WD[w.wd] + ", " + w.d + " " + MONTHS[w.m];

  }

  function budgetView() {
    var mo = state.month, budget = state.budget;
    var totals = (state.totals.length ? state.totals : [{ month: mo.name, daily: sum(state.rows, isDaily) }])
      .map(function (t) { var p = parseMonth(t.month); return p ? { p: p, daily: Number(t.daily) || 0 } : null; })
      .filter(Boolean).sort(function (a, b) { return (a.p.y * 12 + a.p.m) - (b.p.y * 12 + b.p.m); }).slice(-6);

    var W = 340, H = 170, base = 132, top = 14;
    var max = Math.max.apply(null, totals.map(function (t) { return Math.max(t.daily, budget ? budget * daysIn(t.p) : 0); }).concat([1]));
    var slot = W / Math.max(totals.length, 1);
    var bars = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Cost and budget per month">';
    totals.forEach(function (t) {

      bars += '<rect x="' + (cx - 9).toFixed(1) + '" y="' + (base - Math.max(ch, 2)).toFixed(1) + '" width="6" height="' + Math.max(ch, 2).toFixed(1) + '" rx="3" fill="#ff7a2f"><title>Cost ' + inr(t.daily) + "</title></rect>";

      bars += '<text x="' + cx.toFixed(1) + '" y="' + (base + 22) + '" text-anchor="middle" font-size="12" fill="' + (sel ? "#ff7a2f" : "#a39fc0") + '"' + (sel ? ' font-weight="700"' : "") + ">" + MONTHS[t.p.m] + "</text>";

    var goal = !budget ? '<div class="goal"><span class="medal">' + svg(MEDAL, 1.8) + "</span><div><b>Set a daily budget</b><small>Type it in cell B4 of the Dashboard tab</small></div></div>"
      : save >= 0 ? '<div class="goal"><span class="medal">' + svg(MEDAL, 1.8) + "</span><div><b>Monthly goal " + (isCurrent(mo) ? "on track" : "reached") + "</b><small>" + inr(Math.round(save)) + " under budget</small></div></div>"
      : '<div class="goal over"><span class="medal">' + svg("M12 8v5M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z", 1.8) + "</span><div><b>Over budget</b><small>" + inr(Math.round(-save)) + " more than planned</small></div></div>";
    var i = state.months.indexOf(mo);

      refreshBtn(' style="background:#efeafd;color:#5a2ee6"') + "</div>" +
      '<div class="bars">' + bars + '</div><div class="legend"><span><i style="background:#ff7a2f"></i>Cost</span><span><i style="background:#5a2ee6"></i>Budget</span></div></div>' +
      '<div class="body">' + staleNote() + '<div class="summary"><div class="mh">' +
      '<button class="round" data-act="older" aria-label="Previous month"' + (i >= state.months.length - 1 ? " disabled" : "") + ">" + svg("M15 5l-7 7 7 7", 2.4) + "</button>" +
      "<b>" + FULL[mo.m] + "</b>" +
      '<button class="round" data-act="newer" aria-label="Next month"' + (i <= 0 ? " disabled" : "") + ">" + svg("M9 5l7 7-7 7", 2.4) + "</button></div>" +
      '<div class="row"><span>Budget</span><b>' + (budget ? big(monthBudget) : "—") + "</b></div>" +
      '<div class="row cost"><span>Costs</span><b>' + big(spent) + "</b></div>" +
      '<div class="row last"><span>' + (save >= 0 ? "Save" : "Over") + "</span><b>" + (budget ? big(Math.abs(save)) : "—") + "</b></div>" + goal + "</div>" +
      '<p class="note">' + (budget ? inr(budget) + " a day × " + daysIn(mo) + " days. " : "") + (rent ? "Rent (" + inr(rent) + ") and card bills aren't counted." : "Card bills aren't counted.") + "</p>" + footer() + "</div>";
  }

  function settingsView() {
    return '<div class="bhead"><div class="title">Settings</div></div><div class="body">' +
      '<div class="card" style="padding:16px;display:grid;gap:10px"><b>Connected to your sheet</b><span class="note" style="text-align:left">Reading your Daily Finance sheet through your Google script' +
      (state.updatedAt ? " · updated " + ago(state.updatedAt) : "") + ".</span>" +

  }

  function splashView() {
    return '<div class="splash"><h1>Daily<br>Finance</h1><p>Every bank SMS, sorted into a clear picture of where your money goes.</p>' +
      '<svg class="art" viewBox="0 0 320 190" aria-hidden="true"><defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#ff9b5e"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient></defs>' +
      '<circle cx="250" cy="60" r="46" fill="rgba(255,255,255,0.10)"/><circle cx="60" cy="140" r="30" fill="rgba(255,255,255,0.08)"/>' +
      '<path d="M0,150 C50,150 60,90 110,95 C160,100 170,140 215,120 C255,102 265,45 300,40" fill="none" stroke="url(#sg)" stroke-width="5" stroke-linecap="round"/>' +
      '<circle cx="110" cy="95" r="7" fill="#fff"/><path d="M298 28l18 11-18 11z" fill="#ff7a2f"/>' +
      '<text x="62" y="70" font-size="34" font-weight="900" fill="#ff7a2f">₹</text><text x="215" y="165" font-size="22" font-weight="900" fill="rgba(255,255,255,0.5)">%</text></svg>' +
      (state.showConnect ? connectForm() : '<button class="btn" data-act="start" style="justify-self:center;min-width:220px">START</button>' +
        '<ol><li>Run <b>setup</b> in your Apps Script and deploy a New version.</li><li>Run <b>setup</b> again and open the connect link on this iPhone.</li></ol>') + "</div>";
  }
  function connectForm() {
    return '<div class="card"><b>Connect your sheet</b><span class="note" style="text-align:left">Easiest: open the connect link from the setup log. Or paste both values here.</span>' +
      '<div class="field"><label for="cfgUrl">Web app URL</label><input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>' +
      '<div class="field"><label for="cfgKey">App key</label><input id="cfgKey" autocomplete="off" placeholder="from the setup log"></div>' +
      '<span class="err-text" id="cfgErr" hidden></span><button class="btn" data-act="connect">CONNECT</button></div>';
  }

  function render() {
    var v = document.getElementById("view"), tb = document.getElementById("tabbar"), html;
    document.getElementById("app").classList.toggle("bare", !state.connected);
    if (!state.connected) { tb.hidden = true; v.innerHTML = splashView(); return; }
    tb.hidden = false;
    [].forEach.call(tb.querySelectorAll("button"), function (b) {
      var on = b.dataset.tab === state.view;
      b.classList.toggle("on", on);
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (state.view === "settings") html = settingsView();
    else if (state.error && !state.rows) {
      html = '<div class="bhead"><div class="title">Daily Finance</div></div><div class="body"><div class="notice err" role="alert"><b>' + esc(state.error.t) + "</b><span>" + esc(state.error.d) +
        '</span><span><button class="link" data-act="refresh">Try again</button> · <button class="link" data-act="disconnect">Reconnect</button></span></div></div>';
    } else if (!state.rows) {
      html = '<header class="head"><div class="amount"><span class="skel">₹00,000</span></div><div class="amount-sub">Loading your sheet…</div><div style="height:120px"></div></header>';
    } else if (!state.month) {
      html = '<div class="bhead"><div class="title">Daily Finance</div></div><div class="body"><div class="notice"><b>No month tabs yet</b><span>Run setup in the Apps Script editor, or wait for the first bank SMS.</span></div></div>';
    } else if (state.view === "history") html = historyView();
    else if (state.view === "budget") html = budgetView();
    else html = homeView();
    v.innerHTML = html;
  }

  // ---------- events ----------
  document.getElementById("tabbar").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-tab]"); if (!b) return;
    state.view = b.dataset.tab; state.open = null; render(); window.scrollTo(0, 0);
  });
  document.getElementById("view").addEventListener("click", function (ev) {
    var t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.tab) { state.view = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.mode) { state.mode = t.dataset.mode; render(); return; }
    if (t.dataset.period) { state.period = t.dataset.period; render(); return; }
    if (t.dataset.cat !== undefined) { state.cat = t.dataset.cat || null; render(); return; }
    if (t.dataset.open) { state.open = state.open === t.dataset.open ? null : t.dataset.open; render(); return; }
    var act = t.dataset.act;
    if (act === "refresh") refresh();
    else if (act === "older") shiftMonth(1);
    else if (act === "newer") shiftMonth(-1);
    else if (act === "start") { state.showConnect = true; render(); }
    else if (act === "disconnect") {
      try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("df") === 0) localStorage.removeItem(k); }); } catch (e) {}
      state.connected = false; state.rows = null; state.month = null; state.months = []; state.error = null; state.view = "home"; render();
    } else if (act === "connect") {
      var url = document.getElementById("cfgUrl").value.trim().replace(/\/macros\/u\/\d+\/s\//, "/macros/s/");
      var key = document.getElementById("cfgKey").value.trim(), err = document.getElementById("cfgErr");
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) { err.textContent = "The web app URL should start with https://script.google.com/macros/s/ and end in /exec."; err.hidden = false; return; }
      if (key.length < 20) { err.textContent = "Paste the app key from the setup log."; err.hidden = false; return; }
      saveConfig({ url: url, key: key }); load(null);
    }
  });
  document.getElementById("view").addEventListener("input", function (ev) {
    if (ev.target.id === "q") { state.q = ev.target.value; document.getElementById("histbody").innerHTML = historyBody(); }
  });
  // Refresh when the app comes back to the foreground.
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.connected && state.updatedAt && Date.now() - state.updatedAt > 60000) refresh(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  // ---------- start ----------
  var first = cached(null);
  if (first && readConfig()) { state.connected = true; apply(first); }
  load(null);
})();
</script>
</body>
</html>
