<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Finance</title>
<meta name="description" content="Your spending from bank SMS, read from your Daily Finance Google Sheet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#0b1716" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f6f5" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, like a wallet app: month switcher, hero total, today's budget, daily bars, categories, transactions by day. */
:root {
  --bg: #f2f6f5;
  --surface: #ffffff;
  --surface-2: #e8efed;
  --fg: #10272a;
  --muted: #5b7271;
  --line: #d6e2df;
  --accent: #00806f;
  --accent-soft: #d9efe9;
  --on-accent: #ffffff;
  --good: #1f8a4c;
  --warn: #b25b00;
  --bad: #c2362f;
  --bad-soft: #fbe3e1;
  --c1: #e07a2f; --c2: #2f9e5b; --c3: #3b7dd8; --c4: #8a6a3b; --c5: #d0457f;
  --c6: #c49a00; --c7: #d9473e; --c8: #8457c7; --c9: #1d9bb0; --c10: #4b5bd1;
  --c11: #00806f; --c12: #7b8a89;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1716; --surface: #13211f; --surface-2: #1b2c2a; --fg: #e4f0ed; --muted: #92aaa6; --line: #233936;
    --accent: #3cc7b0; --accent-soft: #163a34; --on-accent: #062420;
    --good: #5fd08f; --warn: #f2a54a; --bad: #ff7b72; --bad-soft: #3a1c1a;
    --c1: #f29a55; --c2: #5fcf8a; --c3: #74a8f0; --c4: #c9a26a; --c5: #ee7aab;
    --c6: #e3c14a; --c7: #ff8178; --c8: #b393ee; --c9: #5cc8da; --c10: #8d98f2; --c11: #3cc7b0; --c12: #8fa2a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1716; --surface: #13211f; --surface-2: #1b2c2a; --fg: #e4f0ed; --muted: #92aaa6; --line: #233936;
  --accent: #3cc7b0; --accent-soft: #163a34; --on-accent: #062420;
  --good: #5fd08f; --warn: #f2a54a; --bad: #ff7b72; --bad-soft: #3a1c1a;
  --c1: #f29a55; --c2: #5fcf8a; --c3: #74a8f0; --c4: #c9a26a; --c5: #ee7aab;
  --c6: #e3c14a; --c7: #ff8178; --c8: #b393ee; --c9: #5cc8da; --c10: #8d98f2; --c11: #3cc7b0; --c12: #8fa2a0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { max-width: 560px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left)); padding-block: 0 calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 18px; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: calc(8px + env(safe-area-inset-top)); padding-bottom: 8px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; }
.month { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.month span { min-width: 84px; text-align: center; font-weight: 600; font-size: 0.92rem; }
.iconbtn { appearance: none; border: 0; background: transparent; width: 34px; height: 34px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; color: var(--fg); }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn:disabled { opacity: 0.3; cursor: default; background: transparent; }
.iconbtn:focus-visible, .chip:focus-visible, .txrow:focus-visible, .catrow:focus-visible, .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.iconbtn svg { width: 18px; height: 18px; }
.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin svg { animation: none; } }

/* Hero */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 14px; }
.label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.big { font-family: var(--display); font-weight: 700; font-size: clamp(2.3rem, 11vw, 3.1rem); line-height: 1; letter-spacing: -0.02em; }
.delta { font-size: 0.88rem; color: var(--muted); }
.delta b { font-weight: 600; }
.delta .up { color: var(--bad); } .delta .down { color: var(--good); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat .v { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
.stat .k { font-size: 0.75rem; color: var(--muted); }
.stat .v.good { color: var(--good); }

/* Today */
.today { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; }
.ring { flex: none; width: 74px; height: 74px; }
.today .txt { min-width: 0; display: grid; gap: 2px; }
.today .amt { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; }
.today .sub { font-size: 0.88rem; color: var(--muted); }
.today .sub.over { color: var(--bad); font-weight: 600; }

/* Sections */
section { display: grid; gap: 10px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 { font-family: var(--display); font-size: 1.12rem; margin: 0; letter-spacing: -0.01em; }
.hint { font-size: 0.8rem; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
.chart { padding: 14px 12px 8px; }
.chart svg { display: block; width: 100%; height: auto; }

/* Categories */
.cats { padding: 6px; display: grid; }
.catrow { appearance: none; border: 0; background: transparent; text-align: left; cursor: pointer; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; }
.catrow:hover { background: var(--surface-2); }
.catrow.on { background: var(--accent-soft); }
.catrow .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow .meta { font-size: 0.78rem; color: var(--muted); }
.catrow .val { font-weight: 600; text-align: right; }
.bar { height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 0.9rem; }
.ic svg { width: 18px; height: 18px; }

/* Transactions */
.tools { display: grid; gap: 8px; }
.search { width: 100%; font: inherit; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 0.86rem; cursor: pointer; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.day { display: grid; gap: 2px; }
.dayhead { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); font-weight: 600; padding: 10px 4px 4px; }
.txlist { padding: 4px; display: grid; }
.txrow { appearance: none; border: 0; background: transparent; text-align: left; cursor: pointer; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 12px; width: 100%; }
.txrow:hover { background: var(--surface-2); }
.txrow .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txrow .meta { font-size: 0.78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txrow .val { font-weight: 600; text-align: right; white-space: nowrap; }
.txrow .val.in { color: var(--good); }
.txrow .val.nc { color: var(--muted); font-weight: 500; }
.pill { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.detail { margin: 0 10px 10px 58px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; font-size: 0.84rem; display: grid; gap: 6px; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }

/* States */
.notice { border-radius: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; }
.notice.err { background: var(--bad-soft); border-color: transparent; }
.notice b { font-weight: 600; }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); }
.skel { background: var(--surface-2); border-radius: 8px; color: transparent; }
.linkbtn { appearance: none; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.settings { display: grid; gap: 8px; padding: 14px 16px; }
.settings input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.settings .row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; border: 0; border-radius: 10px; padding: 9px 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
footer { font-size: 0.8rem; color: var(--muted); text-align: center; display: grid; gap: 6px; }
.onboard { display: grid; gap: 14px; padding-top: 8px; }
.onboard h1 { font-family: var(--display); font-size: 1.7rem; line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
.onboard ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--muted); }
.onboard ol b { color: var(--fg); font-weight: 600; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.85rem; font-weight: 600; }
.field input { font: inherit; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.err-text { color: var(--bad); font-size: 0.88rem; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="brand">Daily Finance</div>
    <div class="month" id="monthBox" hidden>
      <button class="iconbtn" id="prev" aria-label="Previous month" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="monthName">Daily Finance</span>
      <button class="iconbtn" id="next" aria-label="Next month" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="iconbtn" id="refresh" aria-label="Refresh" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  </div>
  <div id="content"></div>
</div>
<script>
(function () {
  "use strict";

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var CARD_BILL = "Card Bill Payment", RENT = "Rent";
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var state = {
    connected: false, tabs: [], tab: null, rows: null, prevRows: null, budget: null, updatedAt: null,
    loading: false, error: null, staleError: null, filter: "all", cat: null, q: "", open: null
  };
  // ---------- helpers ----------
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function inr(v) {
    var neg = v < 0; v = Math.abs(v);
    var fixed = (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, "");
    var parts = fixed.split("."), w = parts[0];
    if (w.length > 3) w = w.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + w.slice(-3);
    return (neg ? "−" : "") + "₹" + w + (parts[1] ? "." + parts[1] : "");
  }
  function inrShort(v) {
    if (v >= 100000) return "₹" + (v / 100000).toFixed(v >= 1000000 ? 0 : 1).replace(/\.0$/, "") + "L";
    if (v >= 1000) return "₹" + (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k";
    return "₹" + Math.round(v);
  }
  function parseTab(name) {
    var m = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d{4})$/.exec(name);
    return m ? { name: name, y: +m[2], m: MONTHS.indexOf(m[1]) } : null;
  }
  function isSpend(r) { return r.type === "Expense" && r.category !== CARD_BILL; }
  function isDaily(r) { return isSpend(r) && r.category !== RENT; }
  function sum(list, f) { return list.reduce(function (s, r) { return s + (f(r) ? r.amount : 0); }, 0); }
  function time(w) { var h = w.h % 12 || 12; return h + ":" + String(w.mi).padStart(2, "0") + (w.h < 12 ? " am" : " pm"); }
  function now() { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate() }; }

  // ---------- categories ----------
  var ICON = {
    food: "M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 0-3 2-3 5s1 4 3 4v9",
    cart: "M3 4h2l2 11h11l2-8H6M9 20h.01M17 20h.01",
    car: "M5 16v-5l2-5h10l2 5v5M4 16h16M6 16v2M18 16v2M8 13h.01M16 13h.01",
    fuel: "M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h12M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3M8 8h4",
    bag: "M5 8h14l-1 13H6L5 8zM9 8V6a3 3 0 0 1 6 0v2",
    bolt: "M13 2L4 14h7l-1 8 9-12h-7l1-8z",
    health: "M12 6v12M6 12h12",
    film: "M4 5h16v14H4zM8 5v14M16 5v14M4 12h16",
    plane: "M3 13l18-7-6 15-3-6-9-2z",
    book: "M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4zM5 18a2 2 0 0 1 2-2h12",
    home: "M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5",
    swap: "M7 7h13l-3-3M17 17H4l3 3",
    cash: "M3 7h18v10H3zM12 12h.01M7 10v4M17 10v4",
    card: "M3 6h18v12H3zM3 10h18M7 15h3",
    down: "M12 4v14M6 12l6 6 6-6"
  };
  var CATS = {
    "food & dining": ["--c1", "food"], "food": ["--c1", "food"], "groceries": ["--c2", "cart"],
    "transport": ["--c3", "car"], "fuel": ["--c4", "fuel"], "shopping": ["--c5", "bag"],
    "bills & recharge": ["--c6", "bolt"], "health": ["--c7", "health"], "entertainment": ["--c8", "film"],
    "travel": ["--c9", "plane"], "education": ["--c10", "book"], "rent": ["--c4", "home"],
    "transfers": ["--c12", "swap"], "cash withdrawal": ["--c2", "cash"], "card bill payment": ["--c12", "card"],
    "income": ["--c11", "down"]
  };
  function catMeta(name) {
    var m = CATS[String(name).toLowerCase()];
    if (m) return { color: "var(" + m[0] + ")", icon: m[1] };
    var palette = ["--c1", "--c3", "--c5", "--c8", "--c9", "--c10"], h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return { color: "var(" + palette[h % palette.length] + ")", icon: null };
  }
  function iconHtml(name) {
    var m = catMeta(name);
    var inner = m.icon
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="' + ICON[m.icon] + '"/></svg>'
      : esc(String(name).charAt(0).toUpperCase() || "?");
    return '<span class="ic" style="color:' + m.color + ';background:color-mix(in srgb, ' + m.color + ' 16%, transparent)" aria-hidden="true">' + inner + "</span>";
  }


  // ---------- connection ----------
  var CONFIG_KEY = "dfConfig";
  function readConfig() { try { return JSON.parse(store.get(CONFIG_KEY) || "null"); } catch (e) { return null; } }
  function saveConfig(c) { store.set(CONFIG_KEY, JSON.stringify(c)); }

  // A one-tap link from the script's setup log: …/#connect=<web app URL>&key=<secret>
  (function takeConnectLink() {
    var h = location.hash.replace(/^#/, "");
    if (h.indexOf("connect=") < 0) return;
    var params = {};
    h.split("&").forEach(function (kv) { var i = kv.indexOf("="); if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
    if (params.connect && params.key) saveConfig({ url: params.connect, key: params.key });
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  })();

  function cacheKey(month) { return "dfData:" + (month || "latest"); }
  function cached(month) { try { return JSON.parse(store.get(cacheKey(month)) || "null"); } catch (e) { return null; } }

  function apply(data) {
    state.tabs = (data.months || []).map(parseTab).filter(Boolean);
    state.tab = state.tabs.filter(function (t) { return t.name === data.month; })[0] || null;
    state.rows = toRows(data.rows || []);
    state.prevRows = data.prevMonth ? toRows(data.prevRows || []) : null;
    state.budget = data.budget > 0 ? data.budget : null;
    state.updatedAt = data.generatedAt || Date.now();
  }

  function toRows(list) {
    var out = list.map(function (r, i) {
      return {
        i: i, when: fromMs(r[0]), type: r[1] || "Expense", amount: Number(r[2]) || 0, merchant: r[3] || "Unknown",
        category: r[4] || "Other", bank: r[5] || "", account: String(r[6] || "").replace(/^'/, ""),
        ref: String(r[7] || "").replace(/^'/, ""), sms: r[8] || ""
      };
    });
    out.sort(function (a, b) { return b.when.t - a.when.t; });
    return out;
  }
  function fromMs(ms) {
    var d = new Date(ms);
    return { y: d.getFullYear(), m: d.getMonth(), d: d.getDate(), h: d.getHours(), mi: d.getMinutes(), wd: d.getDay(), t: ms };
  }

  function load(month) {
    var cfg = readConfig();
    if (!cfg) { state.connected = false; render(); return; }
    state.connected = true;
    var hit = cached(month);
    if (hit && (!state.rows || month !== (state.tab && state.tab.name))) { apply(hit); state.cat = null; state.open = null; }
    state.loading = true; state.staleError = null; render();
    var url = cfg.url + (cfg.url.indexOf("?") < 0 ? "?" : "&") + "key=" + encodeURIComponent(cfg.key) + (month ? "&month=" + encodeURIComponent(month) : "");
    fetch(url, { cache: "no-store" })
      .then(function (res) { return res.text(); })
      .then(function (text) {
        var data;
        try { data = JSON.parse(text); } catch (e) { throw { code: "not_json" }; }
        if (data.error === "bad_key") throw { code: "bad_key" };
        store.set(cacheKey(data.month), JSON.stringify(data));
        if (!month) store.set(cacheKey(null), JSON.stringify(data));
        var changedMonth = !state.tab || state.tab.name !== data.month;
        apply(data);
        if (changedMonth) { state.cat = null; state.open = null; }
        state.loading = false; state.error = null; state.staleError = null;
        render();
      })
      .catch(function (e) {
        state.loading = false;
        var copy = e && e.code === "bad_key" ? { t: "The app key doesn't match", d: "Run setup again in the Apps Script editor and open the new connect link." }
          : e && e.code === "not_json" ? { t: "Your script didn't send data", d: "Make sure you deployed a New version of the latest script, with Who has access set to Anyone." }
          : { t: navigator.onLine === false ? "You're offline" : "Couldn't reach your sheet", d: "Pull down or tap refresh to try again." };
        if (e && e.code === "bad_key") { state.rows = null; state.error = copy; }
        else if (state.rows) state.staleError = copy;
        else state.error = copy;
        render();
      });
  }
  function refresh() { load(state.tab ? state.tab.name : null); }
  function selectTab(tab) { load(tab.name); }
  // ---------- views ----------
  function heroHtml() {
    var tab = state.tab, rows = state.rows || [];
    var spent = sum(rows, isSpend);
    var received = sum(rows, function (r) { return r.type === "Income"; });
    var notCounted = sum(rows, function (r) { return r.type === "Transfer" || r.category === CARD_BILL; });
    var delta = "";
    if (state.prevRows && state.prevRows.length) {
      var prevSpent = sum(state.prevRows, isSpend);
      var n = now(), isCurrent = tab.y === n.y && tab.m === n.m;
      var cmp = prevSpent;
      if (isCurrent) cmp = sum(state.prevRows, function (r) { return isSpend(r) && r.when.d <= n.d; });
      if (cmp > 0) {
        var pct = Math.round((spent - cmp) / cmp * 100);
        delta = '<span class="' + (pct > 0 ? "up" : "down") + '"><b>' + (pct > 0 ? "▲ " : "▼ ") + Math.abs(pct) + "%</b></span> vs " +
          (isCurrent ? "the same days of " + FULL[(tab.m + 11) % 12] : FULL[(tab.m + 11) % 12]) + " (" + inr(cmp) + ")";
      }
    }
    return '<div class="hero">' +
      '<div class="label">Spent in ' + FULL[tab.m] + " " + tab.y + "</div>" +
      '<div class="big">' + inr(spent) + "</div>" +
      (delta ? '<div class="delta">' + delta + "</div>" : "") +
      '<div class="stats">' +
        '<div class="stat"><div class="v good">' + inr(received) + '</div><div class="k">Received</div></div>' +
        '<div class="stat"><div class="v">' + inr(sum(rows, function (r) { return isSpend(r) && r.category === RENT; })) + '</div><div class="k">Rent</div></div>' +
        '<div class="stat"><div class="v">' + inr(notCounted) + '</div><div class="k">Card bills</div></div>' +
      "</div></div>";
  }

  function todayHtml() {
    var n = now(), tab = state.tab;
    if (!tab || !(tab.y === n.y && tab.m === n.m)) return "";
    var spent = sum(state.rows || [], function (r) { return isDaily(r) && r.when.d === n.d; });
    var budget = state.budget;
    var ratio = budget ? Math.min(spent / budget, 1) : 0;
    var over = budget && spent > budget;
    var C = 2 * Math.PI * 30;
    var ring = '<svg class="ring" viewBox="0 0 74 74" aria-hidden="true">' +
      '<circle cx="37" cy="37" r="30" fill="none" stroke="var(--surface-2)" stroke-width="8"/>' +
      (budget ? '<circle cx="37" cy="37" r="30" fill="none" stroke="' + (over ? "var(--bad)" : ratio > 0.8 ? "var(--warn)" : "var(--accent)") +
        '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (C * ratio).toFixed(1) + " " + C.toFixed(1) + '" transform="rotate(-90 37 37)"/>' : "") +
      '<text x="37" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)">' + (budget ? Math.round(spent / budget * 100) + "%" : "—") + "</text></svg>";
    var sub = !budget ? "Set a daily budget in cell B4 of the Dashboard tab"
      : over ? inr(spent - budget) + " over your " + inr(budget) + " daily budget"
      : inr(budget - spent) + " left of " + inr(budget);
    return '<div class="today">' + ring + '<div class="txt"><div class="label">Today, excl. rent</div><div class="amt">' + inr(spent) +
      '</div><div class="sub' + (over ? " over" : "") + '">' + esc(sub) + "</div></div></div>";
  }

  function chartHtml() {
    var tab = state.tab, rows = state.rows || [];
    var days = new Date(tab.y, tab.m + 1, 0).getDate();
    var totals = []; for (var i = 1; i <= days; i++) totals.push(0);
    rows.forEach(function (r) { if (isDaily(r)) totals[r.when.d - 1] += r.amount; });
    var max = Math.max.apply(null, totals.concat([state.budget || 0, 1]));
    var W = 340, H = 130, top = 16, bottom = 18, left = 4, right = 4;
    var plotH = H - top - bottom, slot = (W - left - right) / days, bw = Math.max(slot * 0.62, 2);
    var n = now(), isCurrent = tab.y === n.y && tab.m === n.m;
    var maxIdx = totals.indexOf(Math.max.apply(null, totals));
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Spending per day in ' + FULL[tab.m] + '">';
    s += '<line x1="0" x2="' + W + '" y1="' + (top + plotH) + '" y2="' + (top + plotH) + '" stroke="var(--line)" stroke-width="1"/>';
    totals.forEach(function (v, i) {
      var h = v > 0 ? Math.max(v / max * plotH, 2) : 0;
      var x = left + i * slot + (slot - bw) / 2;
      var fill = state.budget && v > state.budget ? "var(--bad)" : (isCurrent && i + 1 === n.d ? "var(--accent)" : "color-mix(in srgb, var(--accent) 45%, var(--surface-2))");
      if (isCurrent && i + 1 > n.d) fill = "var(--surface-2)";
      s += '<rect x="' + x.toFixed(1) + '" y="' + (top + plotH - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="' + Math.min(2, bw / 2).toFixed(1) + '" fill="' + fill + '"><title>' + (i + 1) + " " + MONTHS[tab.m] + ": " + inr(v) + "</title></rect>";
    });
    if (state.budget) {
      var by = top + plotH - state.budget / max * plotH;
      s += '<line x1="0" x2="' + W + '" y1="' + by.toFixed(1) + '" y2="' + by.toFixed(1) + '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>';
      s += '<text x="' + (W - 2) + '" y="' + (by - 4).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--muted)">budget ' + inrShort(state.budget) + "</text>";
    }
    if (totals[maxIdx] > 0) {
      var mx = left + maxIdx * slot + slot / 2, my = top + plotH - totals[maxIdx] / max * plotH - 4;
      var anchor = maxIdx < 3 ? "start" : maxIdx > days - 4 ? "end" : "middle";
      s += '<text x="' + mx.toFixed(1) + '" y="' + Math.max(my, 10).toFixed(1) + '" text-anchor="' + anchor + '" font-size="9.5" font-weight="600" fill="var(--fg)">' + inrShort(totals[maxIdx]) + "</text>";
    }
    [1, 8, 15, 22, days].forEach(function (d) {
      var x = left + (d - 1) * slot + slot / 2;
      s += '<text x="' + x.toFixed(1) + '" y="' + (H - 4) + '" text-anchor="' + (d === 1 ? "start" : d === days ? "end" : "middle") + '" font-size="9" fill="var(--muted)">' + d + "</text>";
    });
    s += "</svg>";
    return '<section><div class="sechead"><h2>Day by day</h2><span class="hint">excl. rent &amp; card bills</span></div><div class="card chart">' + s + "</div></section>";
  }

  function catsHtml() {
    var rows = (state.rows || []).filter(isSpend);
    if (!rows.length) return "";
    var groups = {};
    rows.forEach(function (r) { var g = groups[r.category] || (groups[r.category] = { name: r.category, total: 0, n: 0 }); g.total += r.amount; g.n++; });
    var list = Object.keys(groups).map(function (k) { return groups[k]; }).sort(function (a, b) { return b.total - a.total; });
    var top = list[0].total, all = sum(rows, function () { return true; });
    return '<section><div class="sechead"><h2>Where it went</h2><span class="hint">' + (state.cat ? '<button class="linkbtn" data-act="clearcat">Show all</button>' : "Tap to filter") + '</span></div><div class="card cats">' +
      list.map(function (g) {
        var m = catMeta(g.name);
        return '<button class="catrow' + (state.cat === g.name ? " on" : "") + '" data-cat="' + esc(g.name) + '" aria-pressed="' + (state.cat === g.name) + '">' + iconHtml(g.name) +
          '<span style="min-width:0"><span class="name">' + esc(g.name) + '</span><span class="meta"> · ' + g.n + (g.n === 1 ? " payment" : " payments") + " · " + Math.round(g.total / all * 100) + '%</span>' +
          '<span class="bar"><i style="width:' + (g.total / top * 100).toFixed(1) + "%;background:" + m.color + '"></i></span></span>' +
          '<span class="val">' + inr(g.total) + "</span></button>";
      }).join("") + "</div></section>";
  }

  function txHtml() {
    var chips = [["all", "All"], ["spend", "Spending"], ["in", "Income"], ["nc", "Card bills"]].map(function (c) {
      return '<button class="chip' + (state.filter === c[0] ? " on" : "") + '" data-filter="' + c[0] + '" aria-pressed="' + (state.filter === c[0]) + '">' + c[1] + "</button>";
    }).join("");
    var b = txBody();
    return '<section><div class="sechead"><h2>Transactions' + (state.cat ? " · " + esc(state.cat) : "") + '</h2><span class="hint" id="txcount">' + b.count + "</span></div>" +
      '<div class="tools"><input class="search" id="q" type="search" placeholder="Search merchant, category, bank" value="' + esc(state.q) + '" autocomplete="off"><div class="chips">' + chips + '</div></div><div id="txbody">' + b.body + "</div></section>";
  }

  function txBody() {
    var rows = state.rows || [], q = state.q.trim().toLowerCase();
    var shown = rows.filter(function (r) {
      if (state.cat && !(r.category === state.cat && isSpend(r))) return false;
      if (state.filter === "spend" && !isSpend(r)) return false;
      if (state.filter === "in" && r.type !== "Income") return false;
      if (state.filter === "nc" && !(r.type === "Transfer" || r.category === CARD_BILL)) return false;
      if (q && (r.merchant + " " + r.category + " " + r.bank + " " + r.sms).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var body;
    if (!rows.length) body = '<div class="card empty">No transactions in ' + FULL[state.tab.m] + " yet. They appear here as your bank SMS arrive.</div>";
    else if (!shown.length) body = '<div class="card empty">Nothing matches. <button class="linkbtn" data-act="clearall">Clear filters</button></div>';
    else {
      var byDay = [], idx = {};
      shown.forEach(function (r) {
        var key = r.when.y + "-" + r.when.m + "-" + r.when.d;
        if (!(key in idx)) { idx[key] = byDay.length; byDay.push({ w: r.when, items: [] }); }
        byDay[idx[key]].items.push(r);
      });
      var n = now();
      body = byDay.map(function (g) {
        var w = g.w, label = (w.y === n.y && w.m === n.m && w.d === n.d) ? "Today" : (w.y === n.y && w.m === n.m && w.d === n.d - 1) ? "Yesterday" :
          ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][w.wd] + ", " + w.d + " " + MONTHS[w.m];
        var daySpend = sum(g.items, isSpend);
        return '<div class="day"><div class="dayhead"><span>' + label + "</span><span>" + (daySpend ? "−" + inr(daySpend) : "") + '</span></div><div class="card txlist">' +
          g.items.map(function (r) {
            var key = r.when.t + "|" + r.i, open = state.open === key;
            var cls = r.type === "Income" ? "in" : isSpend(r) ? "" : "nc";
            var sign = r.type === "Income" ? "+" : isSpend(r) ? "−" : "";
            var tag = !isSpend(r) && r.type !== "Income" ? '<span class="pill">not counted</span>' : r.category === RENT ? '<span class="pill">rent</span>' : "";
            var meta = [r.category, time(r.when), r.bank + (r.account ? " ••" + r.account : "")].filter(Boolean).join(" · ");
            var h = '<button class="txrow" data-open="' + esc(key) + '" aria-expanded="' + open + '">' + iconHtml(r.type === "Income" ? "Income" : r.category) +
              '<span style="min-width:0"><span class="name">' + esc(r.merchant) + "</span>" + tag + '<span class="meta" style="display:block">' + esc(meta) + "</span></span>" +
              '<span class="val ' + cls + '">' + sign + inr(r.amount) + "</span></button>";
            if (open) {
              h += '<div class="detail"><dl>' +
                "<dt>Type</dt><dd>" + esc(r.type) + "</dd>" +
                (r.bank ? "<dt>Bank</dt><dd>" + esc(r.bank) + (r.account ? " ••" + esc(r.account) : "") + "</dd>" : "") +
                (r.ref ? "<dt>Reference</dt><dd>" + esc(r.ref) + "</dd>" : "") +
                "</dl>" + (r.sms ? "<p>" + esc(r.sms) + "</p>" : "") + "</div>";
            }
            return h;
          }).join("") + "</div></div>";
      }).join("");
    }
    return { count: shown.length + " of " + rows.length, body: body };
  }


  function onboardHtml() {
    return '<div class="onboard"><h1>Your spending, from every bank SMS</h1>' +
      '<span class="hint">This app shows the Daily Finance Google Sheet your iPhone Shortcut fills in.</span>' +
      '<ol><li>In the Apps Script editor, paste the latest script, <b>Save</b>, choose <b>setup</b> and tap <b>Run</b>.</li>' +
      '<li>Deploy a <b>New version</b> (Deploy → Manage deployments → ✏️).</li>' +
      '<li>Run <b>setup</b> once more and open the <b>connect link</b> it prints, on this iPhone.</li></ol>' +
      '<div class="card settings"><b>Or connect by hand</b>' +
      '<div class="field"><label for="cfgUrl">Web app URL</label><input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>' +
      '<div class="field"><label for="cfgKey">App key</label><input id="cfgKey" autocomplete="off" placeholder="from the setup log"></div>' +
      '<span class="err-text" id="cfgErr" hidden></span>' +
      '<div class="row"><button class="btn" data-act="connect">Connect</button></div></div></div>';
  }

  function ago(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " days ago";
  }

  function render() {
    var el = document.getElementById("content");
    var i = state.tab ? state.tabs.indexOf(state.tab) : -1;
    document.getElementById("monthName").textContent = state.tab ? MONTHS[state.tab.m] + " " + state.tab.y : "Daily Finance";
    document.getElementById("prev").disabled = !(i >= 0 && i < state.tabs.length - 1);
    document.getElementById("next").disabled = !(i > 0);
    document.getElementById("refresh").classList.toggle("spin", !!state.loading);
    document.getElementById("monthBox").hidden = !state.connected;
    document.getElementById("refresh").hidden = !state.connected;
    var html;
    if (!state.connected) html = onboardHtml();
    else if (state.error && !state.rows) {
      html = '<div class="notice err" role="alert"><b>' + esc(state.error.t) + "</b><span>" + esc(state.error.d) + '</span><span><button class="linkbtn" data-act="refresh">Try again</button> · <button class="linkbtn" data-act="disconnect">Reconnect</button></span></div>';
    } else if (!state.rows) {
      html = '<div class="hero"><div class="label">Spent this month</div><div class="big"><span class="skel">₹00,000</span></div><div class="delta">Loading your Daily Finance sheet…</div></div>';
    } else if (!state.tab) {
      html = '<div class="notice"><b>No month tabs yet</b><span>Your sheet has no tabs like “Oct 2026”. Run setup in the Apps Script editor, or wait for the first bank SMS.</span></div>';
    } else {
      html = (state.staleError ? '<div class="notice err" role="status"><b>' + esc(state.staleError.t) + "</b><span>" + esc(state.staleError.d) + " Showing what loaded " + ago(state.updatedAt) + ".</span></div>" : "") +
        heroHtml() + todayHtml() + chartHtml() + catsHtml() + txHtml() +
        '<footer><span>From your Daily Finance sheet · updated ' + ago(state.updatedAt) + '</span><span>Change a category in the sheet and it updates here. <button class="linkbtn" data-act="disconnect">Disconnect</button></span></footer>';
    }
    el.innerHTML = html;
  }


  // ---------- events ----------
  document.getElementById("prev").addEventListener("click", function () {
    var i = state.tabs.indexOf(state.tab); if (i < state.tabs.length - 1) selectTab(state.tabs[i + 1]);
  });
  document.getElementById("next").addEventListener("click", function () {
    var i = state.tabs.indexOf(state.tab); if (i > 0) selectTab(state.tabs[i - 1]);
  });
  document.getElementById("refresh").addEventListener("click", refresh);
  document.getElementById("content").addEventListener("click", function (ev) {
    var t = ev.target.closest("button"); if (!t) return;
    if (t.dataset.cat) { state.cat = state.cat === t.dataset.cat ? null : t.dataset.cat; state.filter = "all"; render(); return; }
    if (t.dataset.filter) { state.filter = t.dataset.filter; state.cat = null; render(); return; }
    if (t.dataset.open) { state.open = state.open === t.dataset.open ? null : t.dataset.open; render(); return; }
    var act = t.dataset.act;
    if (act === "clearcat") { state.cat = null; render(); }
    else if (act === "clearall") { state.cat = null; state.filter = "all"; state.q = ""; render(); }
    else if (act === "refresh") refresh();
    else if (act === "disconnect") {
      try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf("df") === 0) localStorage.removeItem(k); }); } catch (e) {}
      state.connected = false; state.rows = null; state.tab = null; state.tabs = []; state.error = null; render();
    }
    else if (act === "connect") {
      var url = document.getElementById("cfgUrl").value.trim().replace(/\/macros\/u\/\d+\/s\//, "/macros/s/");
      var key = document.getElementById("cfgKey").value.trim();
      var err = document.getElementById("cfgErr");
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) { err.textContent = "The web app URL should start with https://script.google.com/macros/s/ and end in /exec."; err.hidden = false; return; }
      if (key.length < 20) { err.textContent = "Paste the app key from the setup log."; err.hidden = false; return; }
      saveConfig({ url: url, key: key }); load(null);
    }
  });
  document.getElementById("content").addEventListener("input", function (ev) {
    if (ev.target.id === "q") {
      state.q = ev.target.value;
      var b = txBody();
      document.getElementById("txbody").innerHTML = b.body;
      document.getElementById("txcount").textContent = b.count;
    }
  });
  // Refresh when the app comes back to the foreground.
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.connected && state.updatedAt && Date.now() - state.updatedAt > 60000) refresh(); });
  setInterval(function () { if (state.rows && !state.loading && !(document.activeElement && document.activeElement.id === "q")) render(); }, 60000);

  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }

  // ---------- start ----------
  var first = cached(null);
  if (first && readConfig()) { state.connected = true; apply(first); }
  load(null);
})();
</script>
</body>
</html>
